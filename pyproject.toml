[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-fractal-monitor"
version = "0.10.17"
description = "Binance 5000-bar live K-line collection with confirmed and provisional CZSC structures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.1,<3",
  "plotly>=6,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
reference = ["czsc>=0.9.69"]

[project.scripts]
chan-structure = "chan_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "network: integration tests that call Binance",
  "reference: differential tests against the optional czsc package",
]

[tool.ruff]
line-length = 110
target-version = "py310"
